name = "quick-vote"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Run `npx wrangler d1 create quick-vote` and paste the database_id here.
[[d1_databases]]
binding = "DB"
database_name = "quick-vote"
database_id = "58293b60-67a3-44c8-b543-1fe2f46ac6eb"

[vars]
# Set to your GitHub Pages origin, for example "https://phil.github.io".
ALLOWED_ORIGIN = "https://mieslep.github.io"
# Optional secret: `npx wrangler secret put CREATE_CODE`.
# When set, a person must enter this code to create a poll.
